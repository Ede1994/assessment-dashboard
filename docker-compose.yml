services:
  app:
    build: .
    image: assessment-dashboard:local
    ports:
      - "3000:3000"
    environment:
      # Provide SESSION_SECRET via .env / environment (at least 32 chars in production).
      SESSION_SECRET: ${SESSION_SECRET:-assessment-dashboard-docker-secret-change-me-32chars}
      DATABASE_URL: file:./prisma/dev.db
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Open WebUI (Ollama) trainer AI assist — configure via .env / environment:
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    restart: unless-stopped
    # Persist SQLite (and uploads) across container recreations:
    volumes:
      - ./data/dev.db:/app/prisma/dev.db
      - ./data/uploads:/app/public/uploads
